<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MoodPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FAEEDA;
    --paper-soft: #F6E6CC;
    --ink: #4A1B0C;
    --ink-soft: #5F5E5A;
    --ink-faded: #B4B2A9;
    --line-dashed: #D3D1C7;
    --mood-1: #F0997B;
    --mood-2: #FAC775;
    --mood-3: #C0DD97;
    --mood-4: #9FE1CB;
    --mood-5: #F4C0D1;
    --accent-pink: #F4C0D1;
    --accent-mint: #E1F5EE;
    --accent-mint-deep: #B7E2D2;
    --accent-amber: #EF9F27;
    --card-white: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #efe6d4;
    color: var(--ink);
    overflow: hidden;
  }
  .serif { font-family: 'EB Garamond', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #root { width: 100vw; height: 100vh; }

  /* Paper background — subtle fiber texture using layered gradients */
  .paper-bg {
    background:
      radial-gradient(ellipse 800px 600px at 20% 10%, rgba(255,255,255,0.4), transparent 60%),
      radial-gradient(ellipse 600px 400px at 80% 90%, rgba(206,170,120,0.10), transparent 60%),
      var(--paper);
  }

  /* Dashed line input — looks like a notebook line */
  .dashed-line {
    border: none;
    background: transparent;
    border-bottom: 1px dashed var(--line-dashed);
    outline: none;
    width: 100%;
    padding: 4px 0;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    font-size: 15px;
    transition: border-color 200ms;
  }
  .dashed-line:focus { border-bottom-color: var(--ink-soft); border-bottom-style: dashed; }
  .dashed-line::placeholder { color: var(--ink-faded); font-style: italic; }

  /* Pen-stroke saved state */
  .pen-saved {
    position: relative;
    border-bottom-color: transparent !important;
  }
  .pen-saved::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1.5px;
    background: var(--ink);
    transform-origin: left;
    animation: penStroke 240ms ease-out forwards, penFade 600ms 240ms ease-out forwards;
  }
  @keyframes penStroke {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  @keyframes penFade {
    from { background: var(--ink); height: 1.5px; }
    to   { background: var(--line-dashed); height: 1px; }
  }

  /* Washi tape — pink rotated strip */
  .washi {
    position: relative;
    background: var(--accent-pink);
    height: 38px;
    margin: 0 -22px 8px -22px;
    transform: rotate(-1.1deg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.02em;
    box-shadow: 0 1px 0 rgba(74,27,12,0.05);
  }
  .washi::before, .washi::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 14px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.45), rgba(255,255,255,0)),
      var(--accent-pink);
  }
  .washi::before { left: 0; mask: linear-gradient(90deg, transparent 0, black 60%); -webkit-mask: linear-gradient(90deg, transparent 0, black 60%); }
  .washi::after  { right: 0; mask: linear-gradient(90deg, black 40%, transparent); -webkit-mask: linear-gradient(90deg, black 40%, transparent); }
  /* Subtle stripes inside the tape */
  .washi-stripes {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.18) 0 2px,
      transparent 2px 9px
    );
    pointer-events: none;
  }

  /* Notebook card */
  .notebook-card {
    background: var(--card-white);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    box-shadow: 0 1px 0 rgba(74,27,12,0.04);
  }
  .notebook-card::after {
    content: '';
    position: absolute;
    left: 12px; right: 12px; bottom: 0;
    height: 1px;
    border-bottom: 1px dashed var(--line-dashed);
  }

  /* Streak chip */
  .streak-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent-mint);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--ink);
    font-size: 13px;
  }

  /* Mood circle button — base styles */
  .mood-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(74,27,12,0.08);
    background: var(--mood-3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms;
    flex: 0 0 auto;
    padding: 0;
  }
  .mood-circle:hover { transform: scale(1.05); }
  .mood-circle.selected { transform: scale(1.05); box-shadow: 0 4px 12px rgba(74,27,12,0.15); }
  .mood-circle.dimmed { opacity: 0.45; }
  .mood-pulse { animation: moodPulse 1.5s ease-in-out infinite; }
  @keyframes moodPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* Buttons */
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 14px 20px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 15px;
    transition: transform 80ms ease-out;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent-mint-deep); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-back {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Tab bar */
  .tab-bar {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 18px;
    background: rgba(255,253,247,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    height: 64px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: stretch;
    box-shadow: 0 4px 20px rgba(74,27,12,0.10), 0 0 0 1px rgba(74,27,12,0.05);
    z-index: 5;
  }
  .tab-btn {
    background: transparent; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    color: var(--ink-faded);
    font-size: 11px; font-weight: 600;
    transition: color 180ms, transform 180ms;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .tab-btn.active { color: var(--ink); }
  .tab-btn.active .tab-icon { background: var(--accent-mint); }
  .tab-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background 180ms;
  }

  /* Card mount stagger */
  .card-mount {
    animation: cardMount 280ms ease-out backwards;
  }
  @keyframes cardMount {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Heatmap dot */
  .heat-dot {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px dashed transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(74,27,12,0.4);
    font-family: 'EB Garamond', serif;
  }
  .heat-dot.empty { border-color: var(--line-dashed); background: transparent; }
  .heat-dot.today { box-shadow: 0 0 0 2px var(--ink) inset; }

  /* Sticker — base for absolute positioning */
  .sticker {
    position: absolute;
    pointer-events: none;
    transform-origin: center;
  }

  /* Scroll containers */
  .scroll-area {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* Practice done celebration */
  .sticker-peel {
    animation: stickerPeel 1100ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes stickerPeel {
    0%   { opacity: 0; transform: translateY(-220px) rotate(-40deg) scale(0.8); }
    60%  { opacity: 1; transform: translateY(20px) rotate(8deg) scale(1.1); }
    80%  { transform: translateY(-6px) rotate(-10deg) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) rotate(-6deg) scale(1); }
  }
  .fade-up {
    animation: fadeUp 600ms 400ms ease-out backwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Page transition (fade + slight slide) */
  .page-enter {
    animation: pageEnter 320ms ease-out;
  }
  @keyframes pageEnter {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Confetti dot for streak fill */
  .dot-fill {
    animation: dotFill 380ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes dotFill {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</body>
